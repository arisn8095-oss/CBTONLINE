<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CBT Pro - Production System</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <!-- Chosen Palette: Indigo Professional -->
  <!-- Application Structure Plan: SPA dengan dashboard berbasis role (Murid, Guru, Admin). Guru memiliki fitur khusus 'Import DOCX' yang menggunakan Mammoth.js untuk membaca file lokal tanpa API backend yang berat, mem-parsing teks menjadi struktur soal, dan menyimpannya secara batch ke Sheets. -->
  <!-- Visualization & Content Choices: Menggunakan komponen UI Tailwind yang responsif. Soal PG & Essay ditampilkan dalam list interaktif. Preview soal sebelum upload memungkinkan guru melakukan edit metadata ujian secara real-time. -->
  <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

  <style>
    .unselectable { -webkit-user-select: none; user-select: none; }
    #loading-overlay { z-index: 9999; }
    #toast-box { z-index: 2000; }
    .chart-container { position: relative; width: 100%; max-width: 600px; margin-left: auto; margin-right: auto; height: 300px; max-height: 400px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col unselectable" oncontextmenu="return false;">

  <script>
    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwh9KsL5X7t3jTw0PEhhXM_E91YqjEFE5Iu-CkQ3Mn0twKPWDZuEJ9N4XHh8IwavYdCDw/exec";
  </script>

  <div id="app-container" class="max-w-md w-full mx-auto min-h-screen bg-white shadow-2xl flex flex-col relative overflow-hidden">
    
    <div id="security-banner" class="hidden bg-red-600 text-white px-3 py-2 text-[10px] font-bold flex justify-between items-center z-[1100]">
      <span><i class="fa-solid fa-shield-halved mr-1"></i> MODE UJIAN AMAN AKTIF</span>
      <span id="violation-badge" class="bg-red-800 px-2 py-0.5 rounded">Peringatan: 0/3</span>
    </div>

    <!-- LOGIN -->
    <div id="view-login" class="flex-1 flex flex-col justify-center px-8 py-10 bg-slate-900 text-white">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center shadow-xl mb-4">
          <i class="fa-solid fa-graduation-cap text-3xl"></i>
        </div>
        <h1 class="text-2xl font-bold">CBT Pro</h1>
        <p class="text-[10px] text-slate-400 mt-2 uppercase tracking-widest">School Management System</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <input type="text" id="login-user" placeholder="ID Pengguna" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
        <input type="password" id="login-pass" placeholder="Kata Sandi" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-bold shadow-lg transition-all active:scale-95">Masuk</button>
      </form>
    </div>

    <!-- GURU DASHBOARD -->
    <div id="view-guru" class="hidden flex-1 flex flex-col">
      <header class="bg-slate-800 text-white p-4 flex justify-between items-center">
        <div class="text-sm font-bold" id="g-nama">Guru</div>
        <button onclick="logout()" class="text-[10px] border border-white/30 px-2 py-1 rounded">Keluar</button>
      </header>
      <div class="flex border-b bg-white text-[11px] font-bold text-slate-500">
        <button onclick="switchGuruTab('monitor')" id="tab-guru-monitor" class="flex-1 py-3 border-b-2 border-indigo-600 text-indigo-600">Monitor</button>
        <button onclick="switchGuruTab('upload')" id="tab-guru-upload" class="flex-1 py-3 border-b-2 border-transparent">Import .docx</button>
      </div>

      <div class="flex-1 overflow-y-auto p-4 bg-slate-50">
        <div id="guru-data-container"></div>
        
        <div id="guru-upload-container" class="hidden space-y-4">
          <div class="bg-white p-5 rounded-2xl border shadow-sm">
            <h3 class="text-sm font-bold mb-2">Unggah File Soal</h3>
            <p class="text-[10px] text-slate-500 mb-4">Mendukung format [EXAM] (Metadata) dan [SOAL] (PG/Essay).</p>
            <input type="file" id="docx-input" accept=".docx" onchange="processDocxFile(this)" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"/>
          </div>

          <div id="docx-preview-box" class="hidden bg-white p-5 rounded-2xl border shadow-sm space-y-4">
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="col-span-2">
                <label class="text-[10px] font-bold text-slate-400 uppercase">Judul Ujian</label>
                <input type="text" id="prev-judul" class="w-full border rounded-lg p-2 font-bold bg-slate-50">
              </div>
              <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase">Paket</label>
                <input type="text" id="prev-paket" class="w-full border rounded-lg p-2 bg-slate-50">
              </div>
              <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase">Token</label>
                <input type="text" id="prev-token" class="w-full border rounded-lg p-2 font-mono uppercase bg-slate-50">
              </div>
            </div>
            <div id="parsed-questions-list" class="max-h-60 overflow-y-auto space-y-2 border-t pt-2"></div>
            <button onclick="saveDocxToSheets()" class="w-full py-3 bg-emerald-600 text-white rounded-xl font-bold text-xs shadow-lg">Simpan ke Cloud</button>
          </div>
        </div>
      </div>
    </div>

    <!-- MURID VIEW -->
    <div id="view-murid" class="hidden flex-1 flex flex-col">
      <header class="bg-indigo-700 text-white p-5">
        <h2 class="font-bold" id="m-nama">...</h2>
        <p class="text-[10px] opacity-70" id="m-kelas">...</p>
      </header>
      <div id="exam-list" class="p-4 space-y-3 flex-1 overflow-y-auto"></div>
      
      <div id="exam-ui" class="hidden fixed inset-0 z-[1500] bg-white flex flex-col">
        <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
          <div id="ui-timer" class="text-sm font-mono font-bold bg-red-600 px-3 py-1 rounded">00:00</div>
          <button onclick="confirmSubmit()" class="text-[10px] bg-emerald-600 px-3 py-1.5 rounded font-bold">SELESAI</button>
        </div>
        <div id="ui-question-container" class="flex-1 p-6 overflow-y-auto"></div>
        <div class="p-4 border-t bg-slate-50 flex gap-2">
          <button onclick="nav(-1)" class="flex-1 py-3 bg-white border rounded-xl text-xs font-bold">KEMBALI</button>
          <button onclick="nav(1)" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl text-xs font-bold">LANJUT</button>
        </div>
      </div>
    </div>
  </div>

  <div id="loading-overlay" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center text-white">
    <div class="w-10 h-10 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
  </div>
  <div id="toast-box" class="fixed top-6 left-1/2 -translate-x-1/2 w-80 space-y-2"></div>

  <script>
    let session = JSON.parse(sessionStorage.getItem('cbt_session'));
    let questions = [], answers = {}, currentIdx = 0, examTimer = null, parsedDataStore = null;

    async function api(action, payload = {}) {
      showLoading(true);
      try {
        const r = await fetch(APP_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action, ...payload, session_token: session?.session_token })});
        const res = await r.json();
        showLoading(false);
        if (!res.success) showToast(res.message || "Error", "error");
        return res;
      } catch (e) { showLoading(false); return { success: false }; }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const res = await api('login', { username: document.getElementById('login-user').value, password: document.getElementById('login-pass').value });
      if (res.success) { session = res.data; sessionStorage.setItem('cbt_session', JSON.stringify(session)); initView(); }
    }

    function initView() {
      document.querySelectorAll('#app-container > div').forEach(d => d.classList.add('hidden'));
      if (!session) { document.getElementById('view-login').classList.remove('hidden'); return; }
      const v = document.getElementById(`view-${session.role}`);
      if (v) {
        v.classList.remove('hidden');
        if (session.role === 'murid') loadStudentExams();
        else if (session.role === 'guru') switchGuruTab('monitor');
      }
    }

    async function loadStudentExams() {
      document.getElementById('m-nama').innerText = session.nama;
      document.getElementById('m-kelas').innerText = session.kelas_matpel;
      const res = await api('get_student_exams');
      if (res.success) {
        document.getElementById('exam-list').innerHTML = res.data.map(ex => `
          <div class="bg-white p-4 rounded-xl border shadow-sm flex justify-between items-center">
            <div class="text-xs font-bold">${ex.judul_ujian}</div>
            <button onclick="startExam('${ex.exam_id}')" class="bg-indigo-600 text-white text-[10px] px-3 py-1.5 rounded font-bold">MULAI</button>
          </div>
        `).join('');
      }
    }

    function switchGuruTab(tab) {
      document.getElementById('guru-data-container').classList.toggle('hidden', tab !== 'monitor');
      document.getElementById('guru-upload-container').classList.toggle('hidden', tab !== 'upload');
      document.getElementById('tab-guru-monitor').className = `flex-1 py-3 border-b-2 ${tab==='monitor'?'border-indigo-600 text-indigo-600':'border-transparent text-slate-400'}`;
      document.getElementById('tab-guru-upload').className = `flex-1 py-3 border-b-2 ${tab==='upload'?'border-indigo-600 text-indigo-600':'border-transparent text-slate-400'}`;
      if (tab === 'monitor') fetchMonitor();
    }

    async function fetchMonitor() {
      const res = await api('get_guru_data');
      if (res.success) {
        document.getElementById('guru-data-container').innerHTML = res.data.map(r => `
          <div class="p-3 bg-white border-b flex justify-between items-center text-[11px]">
            <div><div class="font-bold">${r.nama}</div><div class="text-slate-400">${r.exam_id}</div></div>
            <div class="text-indigo-600 font-bold text-sm">${r.skor}</div>
          </div>
        `).join('');
      }
    }

    function processDocxFile(input) {
      if (!input.files[0]) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        mammoth.extractRawText({ arrayBuffer: e.target.result }).then(res => parseDocx(res.value));
      };
      reader.readAsArrayBuffer(input.files[0]);
    }

    function parseDocx(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      let exam = { judul_ujian: 'Ujian Baru', paket_code: 'A', durasi_menit: 60, token: 'CBT'+Math.floor(Math.random()*900), kelas_target: 'ALL' };
      let qs = [], cur = null, isH = false;

      lines.forEach(l => {
        if (l.toUpperCase() === '[EXAM]') { isH = true; return; }
        if (l.toUpperCase() === '[SOAL]') { isH = false; return; }
        if (isH) {
          if (l.toUpperCase().startsWith('JUDUL:')) exam.judul_ujian = l.substring(6).trim();
          if (l.toUpperCase().startsWith('PAKET:')) exam.paket_code = l.substring(6).trim();
          if (l.toUpperCase().startsWith('DURASI:')) exam.durasi_menit = parseInt(l.substring(7));
        } else {
          const qm = l.match(/^(\d+)[\.\)]\s*(.+)/);
          if (qm) {
            if (cur) qs.push(cur);
            cur = { teks_soal: qm[2], tipe_soal: 'pg', opsi: [], jawaban_benar: '' };
          } else if (cur) {
            const om = l.match(/^([A-E])[\.\)]\s*(.+)/);
            if (om) cur.opsi.push({ k: om[1], t: om[2] });
            else if (l.toUpperCase().startsWith('KUNCI:')) {
              let k = l.substring(6).trim();
              if (k.toUpperCase() === 'ESSAY') cur.tipe_soal = 'essay';
              else cur.jawaban_benar = k;
            }
          }
        }
      });
      if (cur) qs.push(cur);
      parsedDataStore = { exam, questions: qs };
      renderPreview();
    }

    function renderPreview() {
      const box = document.getElementById('docx-preview-box');
      box.classList.remove('hidden');
      document.getElementById('prev-judul').value = parsedDataStore.exam.judul_ujian;
      document.getElementById('prev-paket').value = parsedDataStore.exam.paket_code;
      document.getElementById('prev-token').value = parsedDataStore.exam.token;
      document.getElementById('parsed-questions-list').innerHTML = parsedDataStore.questions.map((q, i) => `
        <div class="p-2 bg-slate-50 border rounded text-[10px]">
          <div class="font-bold">${i+1}. ${q.teks_soal}</div>
          <div class="text-indigo-600">Kunci: ${q.jawaban_benar || 'ESSAY'}</div>
        </div>
      `).join('');
    }

    async function saveDocxToSheets() {
      const res = await api('create_exam_with_questions', {
        exam: { ...parsedDataStore.exam, judul_ujian: document.getElementById('prev-judul').value, paket_code: document.getElementById('prev-paket').value, token: document.getElementById('prev-token').value },
        questions: parsedDataStore.questions
      });
      if (res.success) { showToast("Selesai!", "success"); switchGuruTab('monitor'); }
    }

    async function startExam(id) {
      const token = prompt("Token:");
      if (!token) return;
      const res = await api('get_exam_questions', { exam_id: id, token });
      if (res.success) {
        questions = res.questions; answers = {}; currentIdx = 0;
        document.getElementById('exam-ui').classList.remove('hidden');
        renderQ(); startTimer(res.exam.durasi_menit * 60);
      }
    }

    function renderQ() {
      const q = questions[currentIdx], c = document.getElementById('ui-question-container');
      c.innerHTML = `<div class="text-sm mb-4 font-bold">${currentIdx+1}. ${q.teks_soal}</div>`;
      if (q.tipe_soal === 'pg') {
        c.innerHTML += q.opsi.map(o => `
          <button onclick="answers['${q.question_id}']='${o.k}';renderQ()" class="w-full text-left p-3 border rounded-xl mb-2 text-xs ${answers[q.question_id]===o.k?'bg-indigo-600 text-white':'bg-white'}">${o.k}. ${o.t}</button>
        `).join('');
      } else {
        c.innerHTML += `<textarea oninput="answers['${q.question_id}']=this.value" class="w-full border p-3 rounded-xl text-xs h-32" placeholder="Jawaban...">${answers[q.question_id]||''}</textarea>`;
      }
    }

    function nav(d) {
      if (currentIdx + d >= 0 && currentIdx + d < questions.length) { currentIdx += d; renderQ(); }
    }

    function startTimer(s) {
      clearInterval(examTimer);
      examTimer = setInterval(() => {
        s--; if (s<=0) { clearInterval(examTimer); confirmSubmit(); }
        const m = Math.floor(s/60).toString().padStart(2,'0'), sc = (s%60).toString().padStart(2,'0');
        document.getElementById('ui-timer').innerText = `${m}:${sc}`;
      }, 1000);
    }

    async function confirmSubmit() {
      if (confirm("Kirim jawaban?")) {
        clearInterval(examTimer);
        await api('submit_exam_answers', { exam_id: questions[0].exam_id, answers, violations: 0 });
        document.getElementById('exam-ui').classList.add('hidden');
        loadStudentExams();
      }
    }

    function showLoading(s) { document.getElementById('loading-overlay').classList.toggle('hidden', !s); }
    function showToast(m, t) {
      const el = document.createElement('div');
      el.className = `p-3 rounded-lg text-white text-[10px] font-bold shadow-xl ${t==='error'?'bg-red-600':'bg-indigo-600'}`;
      el.innerText = m; document.getElementById('toast-box').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }
    function logout() { session = null; sessionStorage.removeItem('cbt_session'); initView(); }

    window.onload = initView;
  </script>
</body>
</html>
