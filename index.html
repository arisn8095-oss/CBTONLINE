<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CBT Pro - Production System</title>
  
  <!-- Chosen Palette: Calm Professional (Indigo, Slate, Emerald) -->
  <!-- Application Structure Plan:
       1. Auth Guard: Layar login adalah satu-satunya yang muncul jika belum ada sesi.
       2. Role-Based Navigation: Dashboard berbeda untuk Admin (Stats), Guru (Monitor/Rekap), dan Murid (Daftar Ujian).
       3. Security Layer: Memasukkan mekanisme pencegahan copy-paste, deteksi pindah tab, dan auto-submit.
       4. State-Driven UI: Menggunakan JavaScript untuk merender soal PG, Kompleks, Menjodohkan, Mengurutkan, dan Essay secara dinamis.
  -->
  <!-- Visualization & Content Choices:
       - Icons: FontAwesome 6 (Canvas-based rendering not required for icons).
       - Styles: Tailwind CSS 3.
       - Exports: jsPDF untuk laporan dan SheetJS untuk data nilai.
  -->
  <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    .unselectable { -webkit-user-select: none; user-select: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    #loading-overlay { z-index: 9999; }
    #toast-box { z-index: 2000; }
    .chart-container { position: relative; width: 100%; max-width: 600px; margin-left: auto; margin-right: auto; height: 300px; max-height: 400px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col unselectable" oncontextmenu="return false;">

  <script>
    /**
     ============================================================
     WAJIB DIUBAH!
     Ganti URL di bawah dengan URL Web App Anda (yang memunculkan pesan "ACTIVE").
     ============================================================
    */
    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzyXcGY9D3AUHEVbJ7JfIha9Qps9tt7ae9sHNXfoN0P3J50gHnLo2sFqnKWs6dyXpisqQ/exec";
  </script>

  <div id="app-container" class="max-w-md w-full mx-auto min-h-screen bg-white shadow-2xl flex flex-col relative overflow-hidden">
    
    <!-- SECURITY BANNER -->
    <div id="security-banner" class="hidden bg-red-600 text-white px-3 py-2 text-[10px] font-bold flex justify-between items-center z-[1100]">
      <span><i class="fa-solid fa-shield-halved mr-1"></i> MODE UJIAN AMAN AKTIF</span>
      <span id="violation-badge" class="bg-red-800 px-2 py-0.5 rounded">Peringatan: 0/3</span>
    </div>

    <!-- VIEW: LOGIN -->
    <div id="view-login" class="flex-1 flex flex-col justify-center px-8 py-10 bg-slate-900 text-white">
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-indigo-600 rounded-3xl mx-auto flex items-center justify-center shadow-2xl mb-4">
          <i class="fa-solid fa-graduation-cap text-4xl text-white"></i>
        </div>
        <h1 class="text-2xl font-bold">CBT Pro</h1>
        <p class="text-xs text-slate-400 mt-2">Masukan kredensial Anda untuk memulai</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">ID Pengguna (NIP/NISN)</label>
          <input type="text" id="login-user" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Kata Sandi</label>
          <input type="password" id="login-pass" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-bold shadow-lg mt-4 transition-all active:scale-95">
          Masuk <i class="fa-solid fa-arrow-right ml-2"></i>
        </button>
      </form>
    </div>

    <!-- VIEW: MURID DASHBOARD -->
    <div id="view-murid" class="hidden flex-1 flex flex-col bg-slate-50">
      <header class="bg-indigo-700 text-white p-5 shadow-lg">
        <div class="flex justify-between items-start">
          <div>
            <h2 class="font-bold text-lg" id="m-nama">...</h2>
            <p class="text-xs opacity-80" id="m-kelas">...</p>
          </div>
          <button onclick="logout()" class="text-[10px] bg-white/20 px-3 py-1.5 rounded-lg border border-white/30">Logout</button>
        </div>
      </header>

      <div class="p-4 flex-1 overflow-y-auto space-y-4">
        <h3 class="text-xs font-bold text-slate-500 uppercase">Daftar Ujian Tersedia</h3>
        <div id="exam-list" class="space-y-3"></div>
      </div>

      <div id="exam-ui" class="hidden fixed inset-0 z-[1500] bg-white flex flex-col">
        <div class="bg-indigo-900 text-white p-4 flex justify-between items-center">
          <div class="text-xs font-bold truncate pr-4" id="ui-title">...</div>
          <div class="bg-red-600 px-3 py-1 rounded-lg text-sm font-mono font-bold" id="ui-timer">00:00</div>
        </div>
        <div id="ui-question-container" class="flex-1 overflow-y-auto p-6"></div>
        <div class="p-4 border-t bg-slate-50 flex gap-2">
          <button onclick="nav(-1)" id="btn-prev" class="flex-1 py-3 bg-white border rounded-xl text-xs font-bold">Kembali</button>
          <button onclick="nav(1)" id="btn-next" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl text-xs font-bold">Lanjut</button>
          <button onclick="confirmSubmit()" id="btn-finish" class="hidden flex-1 py-3 bg-emerald-600 text-white rounded-xl text-xs font-bold">Selesai</button>
        </div>
      </div>
    </div>

    <!-- VIEW: GURU DASHBOARD -->
    <div id="view-guru" class="hidden flex-1 flex flex-col">
      <header class="bg-slate-800 text-white p-4 flex justify-between items-center">
        <div class="text-sm font-bold" id="g-nama">Guru Matpel</div>
        <button onclick="logout()" class="text-[10px] border border-white/30 px-2 py-1 rounded">Logout</button>
      </header>
      <div class="flex border-b bg-white text-[11px] font-bold text-slate-500">
        <button onclick="switchTab('monitor')" id="tab-monitor" class="flex-1 py-3 border-b-2 border-indigo-600 text-indigo-600">Monitoring</button>
        <button onclick="switchTab('rekap')" id="tab-rekap" class="flex-1 py-3 border-b-2 border-transparent">Rekap Nilai</button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 bg-slate-50" id="guru-content"></div>
    </div>

    <!-- VIEW: ADMIN DASHBOARD -->
    <div id="view-admin" class="hidden flex-1 flex flex-col p-6 space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-xl">Admin Panel</h2>
        <button onclick="logout()" class="text-xs text-red-600 font-bold">Logout</button>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100">
          <div class="text-[10px] uppercase font-bold text-indigo-400">Total Murid</div>
          <div class="text-2xl font-black text-indigo-700" id="stat-murid">0</div>
        </div>
        <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
          <div class="text-[10px] uppercase font-bold text-emerald-400">Total Guru</div>
          <div class="text-2xl font-black text-emerald-700" id="stat-guru">0</div>
        </div>
      </div>
      <button class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold text-sm shadow-xl">
        <i class="fa-solid fa-file-import mr-2"></i> Import Data Master (.xlsx)
      </button>
    </div>

  </div>

  <div id="loading-overlay" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center text-white">
    <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-[10px] font-bold tracking-widest uppercase">Sinkronisasi Server...</p>
  </div>

  <div id="toast-box" class="fixed top-6 left-1/2 -translate-x-1/2 w-80 space-y-2 pointer-events-none"></div>

  <script>
    let session = JSON.parse(sessionStorage.getItem('cbt_session'));
    let questions = [];
    let answers = {};
    let currentIdx = 0;
    let violationCount = 0;
    let examTimer = null;

    async function api(action, payload = {}) {
      if (APP_SCRIPT_URL === "MASUKKAN_URL_WEB_APP_ANDA_DI_SINI") {
        showToast("Konfigurasi URL Backend belum dilakukan!", "error");
        return { success: false };
      }
      showLoading(true);
      try {
        const response = await fetch(APP_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action, ...payload, session_token: session?.session_token })
        });
        const res = await response.json();
        showLoading(false);
        if (!res.success) showToast(res.message, "error");
        return res;
      } catch (e) {
        showLoading(false);
        showToast("Koneksi gagal. Periksa URL Apps Script Anda.", "error");
        return { success: false };
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const res = await api('login', {
        username: document.getElementById('login-user').value,
        password: document.getElementById('login-pass').value
      });
      if (res.success) {
        session = res.data;
        sessionStorage.setItem('cbt_session', JSON.stringify(session));
        initView();
      }
    }

    function initView() {
      document.querySelectorAll('#app-container > div').forEach(d => d.classList.add('hidden'));
      if (!session) {
        document.getElementById('view-login').classList.remove('hidden');
        return;
      }
      const roleView = document.getElementById(`view-${session.role}`);
      if (roleView) {
        roleView.classList.remove('hidden');
        if (session.role === 'murid') loadStudentDashboard();
        if (session.role === 'guru') loadGuruDashboard();
        if (session.role === 'admin') loadAdminDashboard();
      }
    }

    async function loadStudentDashboard() {
      document.getElementById('m-nama').innerText = session.nama;
      document.getElementById('m-kelas').innerText = session.kelas_matpel;
      const res = await api('get_student_exams');
      if (res.success) {
        const list = document.getElementById('exam-list');
        list.innerHTML = res.data.map(ex => `
          <div class="bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-center">
            <div>
              <h4 class="text-sm font-bold">${ex.judul_ujian}</h4>
              <p class="text-[10px] text-slate-500">Paket ${ex.paket_code} • ${ex.durasi_menit} Menit</p>
            </div>
            <button onclick="preStart('${ex.exam_id}')" class="bg-indigo-600 text-white text-[10px] px-4 py-2 rounded-lg font-bold">MULAI</button>
          </div>
        `).join('');
      }
    }

    function preStart(id) {
      const token = prompt("Masukkan Token Ujian:");
      if (token) startExam(id, token);
    }

    async function startExam(id, token) {
      const res = await api('get_exam_questions', { exam_id: id, token });
      if (res.success) {
        questions = res.questions;
        currentIdx = 0;
        answers = {};
        violationCount = 0;
        document.getElementById('ui-title').innerText = res.exam.judul_ujian;
        document.getElementById('exam-ui').classList.remove('hidden');
        document.getElementById('security-banner').classList.remove('hidden');
        startSecurity();
        renderQuestion();
        startTimer(res.exam.durasi_menit * 60);
      }
    }

    function renderQuestion() {
      const q = questions[currentIdx];
      const container = document.getElementById('ui-question-container');
      container.innerHTML = `
        <div class="mb-6">
          <span class="text-[10px] font-bold text-indigo-600 tracking-widest uppercase">Pertanyaan ${currentIdx + 1} dari ${questions.length}</span>
          <h3 class="text-base font-medium mt-2 leading-relaxed">${q.teks_soal}</h3>
        </div>
        <div class="space-y-3" id="options-box"></div>
      `;
      const box = document.getElementById('options-box');
      if (q.tipe_soal === 'pg') {
        box.innerHTML = q.opsi.map(o => `
          <div onclick="saveAns('${q.question_id}', '${o.k}')" class="p-4 border-2 rounded-2xl flex items-center gap-4 transition-all ${answers[q.question_id] === o.k ? 'border-indigo-600 bg-indigo-50' : 'border-slate-100'}">
            <div class="w-6 h-6 border-2 rounded-full flex items-center justify-center ${answers[q.question_id] === o.k ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300'}">
              <span class="text-[10px] font-bold">${o.k}</span>
            </div>
            <span class="text-sm">${o.t}</span>
          </div>
        `).join('');
      } else if (q.tipe_soal === 'essay') {
        box.innerHTML = `<textarea oninput="saveAns('${q.question_id}', this.value)" class="w-full border-2 rounded-2xl p-4 text-sm focus:outline-none focus:border-indigo-600 h-40" placeholder="Tulis jawaban Anda di sini...">${answers[q.question_id] || ''}</textarea>`;
      }
      
      document.getElementById('btn-prev').disabled = currentIdx === 0;
      document.getElementById('btn-next').classList.toggle('hidden', currentIdx === questions.length - 1);
      document.getElementById('btn-finish').classList.toggle('hidden', currentIdx !== questions.length - 1);
    }

    function saveAns(qid, val) {
      answers[qid] = val;
      if (questions[currentIdx].tipe_soal === 'pg') renderQuestion();
    }

    function nav(dir) {
      currentIdx += dir;
      renderQuestion();
    }

    function startTimer(sec) {
      clearInterval(examTimer);
      examTimer = setInterval(() => {
        sec--;
        if (sec < 0) { clearInterval(examTimer); autoSubmit(); return; }
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        document.getElementById('ui-timer').innerText = `${m}:${s}`;
      }, 1000);
    }

    function startSecurity() {
      window.onblur = () => {
        violationCount++;
        document.getElementById('violation-badge').innerText = `Peringatan: ${violationCount}/3`;
        showToast(`DILARANG KELUAR APLIKASI!`, "error");
        api('log_violation', { exam_id: questions[0].exam_id, violation_type: 'Pindah Tab' });
        if (violationCount >= 3) autoSubmit();
      };
      document.addEventListener('copy', e => e.preventDefault());
      document.addEventListener('paste', e => e.preventDefault());
    }

    async function autoSubmit() {
      clearInterval(examTimer);
      window.onblur = null;
      await api('submit_exam_answers', { answers, violations: violationCount, exam_id: questions[0].exam_id });
      document.getElementById('exam-ui').classList.add('hidden');
      document.getElementById('security-banner').classList.add('hidden');
      showToast("Ujian selesai dikirim.", "info");
      loadStudentDashboard();
    }

    function showLoading(s) { document.getElementById('loading-overlay').classList.toggle('hidden', !s); }
    
    function showToast(m, type) {
      const t = document.createElement('div');
      t.className = `p-4 rounded-2xl text-xs font-bold text-white shadow-2xl flex justify-between items-center animate-bounce ${type === 'error' ? 'bg-red-600' : 'bg-indigo-600'}`;
      t.innerHTML = `<span>${m}</span><i class="fa-solid fa-xmark ml-4" onclick="this.parentElement.remove()"></i>`;
      document.getElementById('toast-box').appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    function logout() { 
      session = null; 
      sessionStorage.removeItem('cbt_session');
      initView(); 
    }

    window.onload = initView;
  </script>
</body>
</html>
